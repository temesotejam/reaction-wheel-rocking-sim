name: Apply normal target tracking

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply normal closed-loop structure
        run: |
          python .github/normal_closed_loop_migration.py
          rm -f .github/normal_closed_loop_migration.py
      - name: Commit simulator update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/app.js docs/index.html .github/normal_closed_loop_migration.py
          git commit -m "Use one start kick followed by normal target tracking"
          git push
