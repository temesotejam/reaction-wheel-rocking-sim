name: Apply direct one-shot controller

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply direct one-shot mode
        run: |
          python .github/direct_one_shot_migration.py
          rm -f .github/direct_one_shot_migration.py
      - name: Commit simulator update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/app.js docs/index.html .github/direct_one_shot_migration.py
          git commit -m "Add direct target one-shot comparison mode"
          git push
