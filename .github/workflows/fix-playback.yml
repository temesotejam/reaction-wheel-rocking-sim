name: One-shot playback fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-playback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current-axis spread bug
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('docs/app.js')
          s = p.read_text(encoding='utf-8')
          old = 'const iMax=Math.max(activeParams.currentMa*1.08,...a.map(s=>Math.abs(s.currentActualMa))*1.1,10);'
          new = 'const iMax=Math.max(activeParams.currentMa*1.08,...a.map(s=>Math.abs(s.currentActualMa)*1.1),10);'
          if old not in s:
              raise SystemExit('target expression not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/app.js
          git commit -m 'Fix playback crash in synchronized current history'
          git push
