name: Remove artificial Q limit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = Path('.github/q_migration.b64').read_text(encoding='utf-8').strip()
          exec(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          PY
          rm -f .github/q_migration.b64
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove artificial Q saturation from peak controller"
          git push
