name: Remove artificial Q limit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: |
          python - <<'PY'
          import base64, zlib
          exec(zlib.decompress(base64.b64decode("")).decode())
          PY
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/app.js docs/index.html .github/workflows/pages-smoke.yml .github/workflows/remove-artificial-q-limit.yml
          git commit -m "Remove artificial Q saturation from peak controller"
          git push
