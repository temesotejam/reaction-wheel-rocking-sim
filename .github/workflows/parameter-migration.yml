name: Apply measured simulator parameters

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply measured parameter defaults
        run: |
          python .github/parameter_migration.py
          rm -f .github/parameter_migration.py
      - name: Commit simulator parameter update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/app.js docs/index.html .github/parameter_migration.py
          git commit -m "Ground simulator parameters in measured data"
          git push
