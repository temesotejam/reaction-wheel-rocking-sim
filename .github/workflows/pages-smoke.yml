name: Pages browser smoke test

on:
  push:
    branches: [main]

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for deployed Pages to expose latest asset version
        run: |
          set -e
          URL='https://temesotejam.github.io/reaction-wheel-rocking-sim/'
          for i in $(seq 1 30); do
            html=$(curl -fsSL "$URL" || true)
            if echo "$html" | grep -q 'app.js?v=20260903-3'; then
              echo "Latest Pages HTML detected on attempt $i"
              exit 0
            fi
            echo "Waiting for latest Pages HTML... attempt $i"
            sleep 5
          done
          echo "Latest Pages HTML was not observed"
          exit 1

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Exercise deployed Pages in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const url = 'https://temesotejam.github.io/reaction-wheel-rocking-sim/';
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => { errors.push(String(e)); console.error('PAGEERROR:', e); });
            page.on('console', m => console.log('CONSOLE:', m.type(), m.text()));
            const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
            console.log('HTTP', response && response.status());
            console.log('TITLE', await page.title());
            console.log('SCRIPT', await page.locator('script[src]').getAttribute('src'));
            console.log('STYLE', await page.locator('link[rel="stylesheet"]').getAttribute('href'));
            console.log('BUTTON', await page.locator('#playBtn').textContent());
            console.log('INITIAL_T', await page.locator('#liveT').textContent());
            console.log('INITIAL_STATUS', await page.locator('#statusBadge').textContent());
            console.log('EVENT_ROWS', await page.locator('#eventBody tr').count());
            await page.locator('#playBtn').click();
            await page.waitForTimeout(1500);
            const t1 = parseFloat(await page.locator('#liveT').textContent());
            console.log('AFTER_1P5S_T', t1);
            console.log('AFTER_1P5S_THETA', await page.locator('#liveTheta').textContent());
            console.log('AFTER_1P5S_ICMD', await page.locator('#liveICmd').textContent());
            console.log('AFTER_1P5S_IACTUAL', await page.locator('#liveIActual').textContent());
            console.log('BUTTON_AFTER', await page.locator('#playBtn').textContent());
            if (errors.length) throw new Error('Page errors: ' + errors.join(' | '));
            if (!(t1 > 0.5)) throw new Error('Playback did not advance: liveT=' + t1);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
