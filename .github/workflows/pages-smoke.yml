name: Pages browser smoke test

on:
  push:
    branches: [main]

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for deployed v7 Pages
        run: |
          set -e
          URL='https://temesotejam.github.io/reaction-wheel-rocking-sim/'
          for i in $(seq 1 40); do
            html=$(curl -fsSL "$URL" || true)
            if echo "$html" | grep -q 'app.js?v=20260903-7'; then
              echo "v7 Pages detected on attempt $i"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
      - name: Exercise direct one-shot mode in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage();
            const errors=[];
            page.on('pageerror', e => { errors.push(String(e)); console.error('PAGEERROR:', e); });
            const response = await page.goto('https://temesotejam.github.io/reaction-wheel-rocking-sim/', {waitUntil:'networkidle',timeout:120000});
            console.log('HTTP', response && response.status());
            const script = await page.locator('script[src]').getAttribute('src');
            const mode = await page.locator('#controlMode').inputValue();
            console.log('SCRIPT', script);
            console.log('MODE', mode);
            console.log('STATUS', await page.locator('#statusBadge').textContent());
            if (script !== 'app.js?v=20260903-7') throw new Error('Wrong app asset version');
            if (mode !== 'direct_one_shot') throw new Error('Direct one-shot is not default');

            const rows = await page.locator('#eventBody tr').evaluateAll(rs => rs.map(r => [...r.querySelectorAll('td')].map(td => td.textContent.trim())));
            if (!rows.length) throw new Error('No half-cycle decisions');
            const nonzero = rows.filter(r => parseFloat(r[8]) > 1e-6);
            console.log('EVENT_COUNT', rows.length);
            console.log('NONZERO_Q_EVENTS', nonzero.length);
            console.log('FIRST_EVENT', JSON.stringify(rows[0]));
            if (rows[1]) console.log('SECOND_EVENT', JSON.stringify(rows[1]));
            if (nonzero.length !== 1) throw new Error('Direct one-shot should issue exactly one nonzero Q event');
            const firstQ = parseFloat(rows[0][8]);
            const firstActual = parseFloat(rows[0][11]);
            const firstError = parseFloat(rows[0][12]);
            console.log('FIRST_QCMD', firstQ);
            console.log('FIRST_ACTUAL_PEAK', firstActual);
            console.log('FIRST_ERROR', firstError);
            if (!(firstQ > 1.197)) throw new Error('Expected first direct request to be above identified Q range');
            if (!(firstActual > 0.4 && firstActual < 1.5)) throw new Error('Unexpected first one-shot peak');
            if (!(firstError > 0.5)) throw new Error('One-shot unexpectedly reached target with current model');
            if (rows.length > 1 && parseFloat(rows[1][8]) !== 0) throw new Error('Second zero-cross must be passive Q=0');

            const peakRows = rows.filter(r => r[11] && r[11] !== '—');
            console.log('LAST_COMPLETED_EVENT', peakRows.length ? JSON.stringify(peakRows[peakRows.length-1]) : 'none');

            await page.locator('#playBtn').click();
            await page.waitForTimeout(1500);
            const t1 = parseFloat(await page.locator('#liveT').textContent());
            console.log('AFTER_1P5S_T', t1);
            console.log('LIVE_THETA', await page.locator('#liveTheta').textContent());
            console.log('LIVE_QCMD', await page.locator('#liveQcmd').textContent());
            console.log('LIVE_RPM', await page.locator('#liveRpm').textContent());
            if (errors.length) throw new Error('Page errors: '+errors.join(' | '));
            if (!(t1 > 0.5)) throw new Error('Playback did not advance');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
