name: Pages browser smoke test

on:
  push:
    branches: [main]

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for deployed v8 Pages
        run: |
          set -e
          URL='https://temesotejam.github.io/reaction-wheel-rocking-sim/'
          for i in $(seq 1 40); do
            html=$(curl -fsSL "$URL" || true)
            if echo "$html" | grep -q 'app.js?v=20260903-8'; then
              echo "v8 Pages detected on attempt $i"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
      - name: Exercise normal target tracking in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage();
            const errors=[];
            page.on('pageerror', e => { errors.push(String(e)); console.error('PAGEERROR:', e); });
            const response = await page.goto('https://temesotejam.github.io/reaction-wheel-rocking-sim/', {waitUntil:'networkidle',timeout:120000});
            console.log('HTTP', response && response.status());
            const script = await page.locator('script[src]').getAttribute('src');
            console.log('SCRIPT', script);
            console.log('STATUS', await page.locator('#statusBadge').textContent());
            if (script !== 'app.js?v=20260903-8') throw new Error('Wrong app asset version');
            if ((await page.locator('#controlMode').count()) !== 0) throw new Error('Special control-mode selector should not exist');

            const rows = await page.locator('#eventBody tr').evaluateAll(rs => rs.map(r => [...r.querySelectorAll('td')].map(td => td.textContent.trim())));
            if (!rows.length) throw new Error('No half-cycle decisions');
            const nonzero = rows.filter(r => parseFloat(r[8]) > 1e-6);
            const completed = rows.filter(r => r[11] && r[11] !== '—');
            if (!completed.length) throw new Error('No completed controlled peaks');
            const actuals = completed.map(r => parseFloat(r[11])).filter(Number.isFinite);
            const maxActual = Math.max(...actuals);
            const first = completed[0];
            const last = completed[completed.length-1];
            const firstActual = parseFloat(first[11]);
            const lastActual = parseFloat(last[11]);
            console.log('EVENT_COUNT', rows.length);
            console.log('NONZERO_Q_EVENTS', nonzero.length);
            console.log('FIRST_COMPLETED_EVENT', JSON.stringify(first));
            console.log('LAST_COMPLETED_EVENT', JSON.stringify(last));
            console.log('MAX_ACTUAL_PEAK', maxActual);
            if (!(nonzero.length >= 3)) throw new Error('Normal target tracking did not keep correcting after the first half-cycle');
            if (!(maxActual > 1.8)) throw new Error('Target-tracking law did not naturally build amplitude toward 2 deg');
            if (!(Math.abs(lastActual - 2.0) < 0.10)) throw new Error('Final completed peak is not close to 2 deg target');
            if (!(lastActual > firstActual)) throw new Error('Amplitude did not grow from the first controlled peak');

            await page.locator('#playBtn').click();
            await page.waitForTimeout(1500);
            const t1 = parseFloat(await page.locator('#liveT').textContent());
            console.log('AFTER_1P5S_T', t1);
            console.log('LIVE_THETA', await page.locator('#liveTheta').textContent());
            console.log('LIVE_QCMD', await page.locator('#liveQcmd').textContent());
            console.log('LIVE_RPM', await page.locator('#liveRpm').textContent());
            if (errors.length) throw new Error('Page errors: '+errors.join(' | '));
            if (!(t1 > 0.5)) throw new Error('Playback did not advance');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
