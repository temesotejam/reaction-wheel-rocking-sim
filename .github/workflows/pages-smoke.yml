name: Pages browser smoke test

on:
  push:
    branches: [main]

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for deployed v6 Pages
        run: |
          set -e
          URL='https://temesotejam.github.io/reaction-wheel-rocking-sim/'
          for i in $(seq 1 40); do
            html=$(curl -fsSL "$URL" || true)
            if echo "$html" | grep -q 'app.js?v=20260903-6'; then
              echo "v6 Pages detected on attempt $i"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
      - name: Exercise measured-parameter controller in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const near = (a,b,tol=1e-9) => Math.abs(Number(a)-b) <= tol;
          (async () => {
            const browser = await chromium.launch({ headless:true });
            const page = await browser.newPage();
            const errors=[];
            page.on('pageerror', e => { errors.push(String(e)); console.error('PAGEERROR:', e); });
            const response = await page.goto('https://temesotejam.github.io/reaction-wheel-rocking-sim/', {waitUntil:'networkidle',timeout:120000});
            console.log('HTTP', response && response.status());
            const script = await page.locator('script[src]').getAttribute('src');
            console.log('SCRIPT', script);
            if (script !== 'app.js?v=20260903-6') throw new Error('Wrong app asset version');
            if ((await page.locator('#qMaxMas').count()) !== 0) throw new Error('Artificial qMaxMas UI still exists');
            if ((await page.locator('#icg').count()) !== 0) throw new Error('Obsolete Icg input still exists');

            const vals = {};
            for (const id of ['gPlus','gMinus','qModelMinMas','qModelMaxMas','kt','jw','maxRpm','massKg','ieff','viscous','coulomb']) {
              vals[id] = Number(await page.locator('#'+id).inputValue());
            }
            console.log('PARAMS', JSON.stringify(vals));
            if (!near(vals.gPlus,0.290316,1e-9)) throw new Error('gPlus default mismatch');
            if (!near(vals.gMinus,0.254547,1e-9)) throw new Error('gMinus default mismatch');
            if (!near(vals.qModelMinMas,0.454,1e-9) || !near(vals.qModelMaxMas,1.197,1e-9)) throw new Error('Q support mismatch');
            if (!near(vals.kt,0.036,1e-9)) throw new Error('kt default mismatch');
            if (!near(vals.jw,0.000021,1e-12)) throw new Error('Jw default mismatch');
            if (!near(vals.maxRpm,1050,1e-9)) throw new Error('wheel rpm default mismatch');
            if (!near(vals.massKg,0.1997,1e-9)) throw new Error('mass default mismatch');
            if (!near(vals.ieff,0.00090,1e-12)) throw new Error('Ieff default mismatch');
            if (!near(vals.viscous,0.00050,1e-12)) throw new Error('viscous default mismatch');
            if (!near(vals.coulomb,0,1e-12)) throw new Error('coulomb default mismatch');

            const rows = await page.locator('#eventBody tr').evaluateAll(rs => rs.map(r => [...r.querySelectorAll('td')].map(td => td.textContent.trim())));
            if (!rows.length) throw new Error('No half-cycle decisions');
            console.log('FIRST_EVENT', JSON.stringify(rows[0]));
            const completed = rows.filter(r => r[11] && r[11] !== '—');
            if (completed.length) console.log('LAST_COMPLETED_EVENT', JSON.stringify(completed[completed.length-1]));
            console.log('STATUS', await page.locator('#statusBadge').textContent());

            await page.locator('#playBtn').click();
            await page.waitForTimeout(1500);
            const t1 = parseFloat(await page.locator('#liveT').textContent());
            console.log('AFTER_1P5S_T', t1);
            console.log('LIVE_THETA', await page.locator('#liveTheta').textContent());
            console.log('LIVE_QCMD', await page.locator('#liveQcmd').textContent());
            console.log('LIVE_RPM', await page.locator('#liveRpm').textContent());
            console.log('LIVE_MODEL', await page.locator('#liveModelStatus').textContent());
            if (errors.length) throw new Error('Page errors: '+errors.join(' | '));
            if (!(t1 > 0.5)) throw new Error('Playback did not advance');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
